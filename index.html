<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4ead2">
  <title>AQDI Ceremony | Sevvri & Rahma</title>
  <style>
    :root{--ivory:#fff8e8;--pearl:#f8efd9;--champagne:#e6c57c;--gold:#c3913c;--sage:#65765e;--bronze:#7b542d;--ink:#3f2c1d;--deep:#1e1711;--shadow:0 24px 80px rgba(45,27,10,.34)}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 50% 12%,#fff9e9 0,#ead6a8 34%,#57411e 100%);color:var(--ink);overflow:hidden}
    body:before{content:"";position:fixed;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.22),transparent 28%,rgba(189,139,49,.2) 58%,transparent 76%);mix-blend-mode:screen;pointer-events:none}
    button,input{font:inherit}.app{position:relative;height:100dvh;width:100vw;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth}.slides{width:100%;display:block}.slide{position:relative;width:100vw;min-height:100dvh;display:grid;place-items:center;padding:18px;overflow:hidden;isolation:isolate;scroll-snap-align:start}
    .slide:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,250,235,.96),rgba(232,202,134,.72) 48%,rgba(96,70,34,.42) 100%);z-index:-3}.slide:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,250,230,.12),rgba(32,22,12,.22) 82%);z-index:-2}
    .stage{position:relative;width:min(92vw,430px);height:min(92dvh,716px);max-height:716px;aspect-ratio:307/512;filter:drop-shadow(var(--shadow));transform:translateZ(0);animation:breath 9s ease-in-out infinite}.art-card{position:absolute;inset:0;border-radius:26px;background-image:var(--art);background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.38),0 26px 80px rgba(30,20,8,.45);overflow:hidden}
    .art-card:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 0 42%,rgba(255,247,215,.28) 50%,transparent 58%);transform:translateX(-120%);animation:shimmer 7s ease-in-out infinite}.opening .stage{perspective:1100px}.opening .art-card{transform-origin:50% 18%;transition:transform 2.4s cubic-bezier(.16,.8,.2,1),filter 1.2s,box-shadow 1.2s}.opening.open .art-card{transform:translateY(-96px) scale(1.035) rotateX(11deg);filter:brightness(1.16) saturate(1.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 46px 110px rgba(30,20,8,.54)}.opening.open:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 56%,rgba(255,225,145,.68),rgba(255,196,80,.18) 28%,transparent 58%);z-index:2;pointer-events:none;animation:champagneFlash 2.2s ease-out}
    .seal-focus{position:absolute;left:50%;top:64%;width:17%;aspect-ratio:1;border:0;background:transparent;padding:0;border-radius:50%;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;appearance:none;outline:none}.seal-focus:focus,.seal-focus:focus-visible,.seal-focus:active{outline:none;background:transparent;box-shadow:none}
    .flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 48%,rgba(255,230,155,.82),rgba(217,168,82,.42) 30%,transparent 68%);opacity:0;pointer-events:none;mix-blend-mode:screen;z-index:20}.flash.on{animation:champagneFlash 1.25s ease-out}
    .mihrab{position:absolute;left:50%;top:49%;width:77%;min-height:48%;transform:translate(-50%,-50%);padding:34px 25px 28px;text-align:center;background:linear-gradient(180deg,rgba(255,249,231,.88),rgba(238,218,166,.86));border:1px solid rgba(174,126,50,.5);box-shadow:inset 0 0 30px rgba(255,255,255,.6),0 12px 35px rgba(85,52,14,.2);clip-path:polygon(50% 0,72% 8%,88% 25%,94% 48%,94% 100%,6% 100%,6% 48%,12% 25%,28% 8%);display:flex;flex-direction:column;justify-content:center;gap:8px}.art-only .mihrab{display:none}
    .mihrab.compact{top:53%;min-height:38%;padding-top:28px}.mihrab.tall{top:52%;min-height:58%;width:82%;gap:6px}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze)}h1,h2,p{margin:0}h1{font-size:34px;line-height:1;color:#916522;text-shadow:0 1px 0 #fff3bf}h2{font-size:23px;color:#744b22}.arabic{font-family:"Times New Roman",serif;direction:rtl;font-size:22px;line-height:1.45;color:#5b3b1d}.small{font-size:13px;line-height:1.45}.verse{font-size:14px;line-height:1.55;color:#4d3520}.divider{height:1px;width:72%;margin:5px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}.names{font-size:25px;line-height:1.18;color:#4e3420}.lead{font-size:16px;line-height:1.45}.gold{color:#a06f25}.one-card{font-weight:bold;color:#7b542d}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{border:1px solid rgba(161,111,37,.36);border-radius:999px;padding:7px 8px;background:rgba(255,255,255,.36);font-size:13px}
    .programme{display:grid;gap:6px;text-align:left}.item{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:start;font-size:12.5px;line-height:1.25}.item time{font-weight:bold;color:#906422}.item ul{margin:3px 0 0 15px;padding:0}.item li{margin:1px 0}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.count b{display:block;font-size:20px;color:#7b542d}.count span{font-size:10px;text-transform:uppercase;letter-spacing:.12em}.rsvp-actions{display:grid;gap:8px;margin-top:4px}.btn{border:1px solid rgba(119,75,31,.35);border-radius:999px;padding:10px 14px;background:linear-gradient(180deg,#d6b166,#9a6929);color:white;text-decoration:none;box-shadow:0 8px 24px rgba(79,48,12,.22);cursor:pointer}.btn.secondary{background:rgba(255,250,232,.7);color:#5f3e1d}.field{width:100%;border:1px solid rgba(139,92,33,.38);border-radius:14px;padding:9px 11px;background:rgba(255,255,255,.62);color:#3f2c1d}.qr{width:112px;height:112px;margin:4px auto;border-radius:14px;background:#fff;padding:7px;box-shadow:0 8px 24px rgba(60,35,8,.2)}
    .scratch-wrap{position:absolute;left:50%;top:45%;width:82%;height:235px;transform:translateX(-50%);border-radius:34px;overflow:hidden;border:0;background:transparent;box-shadow:0 10px 26px rgba(75,45,12,.12)}.scratch-wrap.done{pointer-events:none}.scratch-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .45s ease}.scratch-wrap.done canvas{opacity:0}.rsvp-panel{top:auto;bottom:7%;min-height:auto;width:78%;padding:18px 20px;clip-path:none;border-radius:24px;background:linear-gradient(180deg,rgba(255,249,231,.82),rgba(238,218,166,.78))}
    .particles,.butterflies{position:fixed;inset:0;pointer-events:none;z-index:0}.stage{z-index:1}.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(255,216,123,.75);box-shadow:0 0 12px rgba(255,219,120,.85);animation:floatUp var(--d) linear infinite}.butterfly{position:absolute;color:rgba(255,252,238,.78);font-size:22px;filter:drop-shadow(0 0 9px rgba(255,225,154,.7));animation:butterfly 9s ease-in-out infinite}.burst-butterfly{position:absolute;left:50%;top:58%;z-index:5;color:rgba(255,250,221,.95);font-size:24px;filter:drop-shadow(0 0 10px rgba(255,213,104,.9));animation:burstFly 5.8s ease-out forwards}.hidden{display:none}.nav{display:none}.dashboard{position:fixed;right:14px;top:14px;z-index:35}.dash-panel{position:absolute;right:0;top:48px;width:min(92vw,330px);padding:14px;border-radius:18px;background:rgba(255,248,226,.94);box-shadow:var(--shadow);border:1px solid rgba(147,101,36,.28);display:none}.dash-panel.open{display:block}.dash-panel textarea{height:76px;resize:vertical}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all}.status{font-size:12px;color:#6a4a25}.hotspot{position:absolute;display:block;text-indent:-9999px;overflow:hidden;background:transparent;border:0}.rsvp-hotspot{left:15%;top:39%;width:70%;height:9%;border-radius:999px}.pass-hotspot{left:18%;top:76%;width:64%;height:8%;border-radius:999px}.count-live{position:absolute;left:8%;top:45%;width:84%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.count-live div{height:76px;border-radius:13px;background:rgba(42,27,14,.88);border:1px solid rgba(222,179,89,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 16px rgba(255,224,153,.22),0 8px 22px rgba(40,24,8,.28)}.count-live b{font-size:28px;line-height:1;color:#ffe3a4}.count-live span{margin-top:6px;font-size:10px;color:#fff1ca}.qr-live{position:absolute;left:50%;top:45%;width:36%;height:auto;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:12px;background:#fff;padding:6px;box-shadow:0 5px 14px rgba(60,35,8,.16)}.pass-key-live{position:absolute;left:50%;top:64%;width:62%;transform:translateX(-50%);font-size:13px;text-align:center;color:#442e18;background:rgba(255,246,222,.96);border-radius:999px;padding:7px 8px}
    @keyframes breath{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.015) translateY(-6px)}}@keyframes shimmer{0%,56%{transform:translateX(-130%)}72%,100%{transform:translateX(130%)}}@keyframes pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:.95;transform:scale(1.12)}}@keyframes sealBurst{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}@keyframes champagneFlash{0%{opacity:0}28%{opacity:1}100%{opacity:0}}@keyframes floatUp{0%{transform:translateY(105vh) scale(.6);opacity:0}18%{opacity:.65}100%{transform:translateY(-10vh) scale(1.05);opacity:0}}@keyframes butterfly{0%,100%{transform:translate3d(0,0,0) rotate(-8deg)}50%{transform:translate3d(34px,-45px,0) rotate(9deg)}}@keyframes burstFly{0%{opacity:0;transform:translate(-50%,0) scale(.3) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),var(--y)) scale(1.25) rotate(var(--r))}}@media (max-width:480px){.slide{padding:10px}.stage{width:96vw;height:auto}.mihrab{width:82%;padding:28px 19px 23px}.mihrab.tall{width:86%;min-height:60%}h1{font-size:29px}h2{font-size:20px}.names{font-size:21px}.arabic{font-size:19px}.item{grid-template-columns:62px 1fr;font-size:11.2px}.count b{font-size:17px}.nav{bottom:8px}.scratch-note{top:73%;white-space:nowrap}}
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="particles" id="particles"></div><div class="butterflies" id="butterflies"></div><div class="flash" id="flash"></div>
    <div class="slides" id="slides">
      <section class="slide opening" style="--art:url('assets/aqdi-master-slide-00.jpg')" aria-label="Luxury envelope">
        <div class="stage envelope-stage"><div class="art-card"></div><button class="seal-focus" id="seal" aria-label="Open invitation"></button></div>
      </section>
      <section class="slide art-only" style="--art:url('assets/aqdi-master-slide-01.jpg')" aria-label="Bismillah opening">
        <div class="stage"><div class="art-card"></div></div>
      </section>
      <section class="slide art-only" style="--art:url('assets/aqdi-master-slide-02.jpg')" aria-label="Invitation">
        <div class="stage"><div class="art-card"></div></div>
      </section>
      <section class="slide" style="--art:url('assets/aqdi-master-slide-03.jpg')" aria-label="Scratch and reveal">
        <div class="stage"><div class="art-card"></div><div class="scratch-wrap" id="scratchWrap"><canvas id="scratchCanvas" width="500" height="235" aria-label="Scratch or tap to reveal the AQDI date"></canvas></div></div>
      </section>
      <section class="slide" style="--art:url('assets/aqdi-master-slide-04.jpg')" aria-label="Countdown">
        <div class="stage"><div class="art-card"></div><div class="count-live" id="countdown"><div><b>00</b><span>Days</span></div><div><b>00</b><span>Hours</span></div><div><b>00</b><span>Minutes</span></div><div><b>00</b><span>Seconds</span></div></div></div>
      </section>
      <section class="slide art-only" style="--art:url('assets/aqdi-master-slide-05.jpg')" aria-label="Venue">
        <div class="stage"><div class="art-card"></div></div>
      </section>
      <section class="slide art-only" style="--art:url('assets/aqdi-master-slide-06.jpg')" aria-label="Programme part 1">
        <div class="stage"><div class="art-card"></div></div>
      </section>
      <section class="slide art-only" style="--art:url('assets/aqdi-master-slide-07.jpg')" aria-label="Programme part 2">
        <div class="stage"><div class="art-card"></div></div>
      </section>
      <section class="slide" style="--art:url('assets/aqdi-master-slide-08.jpg')" aria-label="RSVP">
        <div class="stage"><div class="art-card"></div><a class="hotspot rsvp-hotspot" id="whatsappBtn" target="_blank" rel="noopener">Confirm via WhatsApp</a><button class="hotspot pass-hotspot" id="makePass">Generate Security Pass</button></div>
      </section>
      <section class="slide" style="--art:url('assets/aqdi-master-slide-09.jpg')" aria-label="Security pass">
        <div class="stage"><div class="art-card"></div><canvas class="qr-live" id="qrCanvas" width="240" height="240" aria-label="Guest QR code"></canvas><p class="pass-key-live mono" id="passKey">Pending approval from Kareem</p></div>
      </section>
    </div>
    <div class="dashboard"><button class="btn secondary" id="dashToggle">Guest Control</button><div class="dash-panel" id="dashPanel"><h2>Dashboard</h2><p class="status" id="dashStatus">No guest pass generated yet.</p><input class="field" id="dashGuest" placeholder="Guest name override"><textarea class="field mono" id="dashNotes" placeholder="Internal notes"></textarea><button class="btn" id="dashSave">Save Guest Control</button><p class="small">Smoke test RSVP: +255 697 154 111</p></div></div>
    <nav class="nav" aria-label="Invitation navigation"><button id="prev" aria-label="Previous slide">‹</button><div class="dots" id="dots"></div><button id="next" aria-label="Next slide">›</button></nav>
  </div>
  <script>
  (function(){
    const state={index:0,total:10,coordinator:'Smoke Test',coordinatorWhatsApp:'255697154111',eventDate:new Date('2026-10-23T21:30:00+03:00'),passKey:'Pending approval from Kareem'};
    const slides=document.getElementById('slides'),dots=document.getElementById('dots'),flash=document.getElementById('flash'),butterflies=document.getElementById('butterflies');
    for(let i=0;i<state.total;i++){const d=document.createElement('span');d.className='dot';dots.appendChild(d)}
    function setActive(i){state.index=Math.max(0,Math.min(state.total-1,i));[...dots.children].forEach((d,n)=>d.classList.toggle('active',n===state.index))}
    function show(i){setActive(i);document.getElementById('app').scrollTo({top:state.index*window.innerHeight,behavior:'smooth'})}
    document.getElementById('prev').onclick=()=>show(state.index-1);document.getElementById('next').onclick=()=>show(state.index+1);
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(state.index+1);if(e.key==='ArrowLeft')show(state.index-1)});
    document.getElementById('seal').onclick=()=>{const opening=document.querySelector('.opening');if(opening.classList.contains('open'))return;opening.classList.add('open');flash.classList.add('on');for(let i=0;i<18;i++){const b=document.createElement('i');b.className='burst-butterfly';b.textContent=i%3?'✦':'♡';b.style.setProperty('--x',(Math.random()*260-130)+'px');b.style.setProperty('--y',(-120-Math.random()*340)+'px');b.style.setProperty('--r',(Math.random()*120-60)+'deg');b.style.animationDelay=(Math.random()*1.2)+'s';opening.appendChild(b);setTimeout(()=>b.remove(),6500)}setTimeout(()=>flash.classList.remove('on'),2200);setTimeout(()=>show(1),10000)};
    function particles(){const p=document.getElementById('particles');for(let i=0;i<56;i++){const s=document.createElement('i');s.className='particle';s.style.left=Math.random()*100+'vw';s.style.setProperty('--d',9+Math.random()*18+'s');s.style.animationDelay=-Math.random()*18+'s';p.appendChild(s)}for(let i=0;i<10;i++){const b=document.createElement('i');b.className='butterfly';b.textContent=i%2?'✦':'♡';b.style.left=8+Math.random()*84+'vw';b.style.top=14+Math.random()*68+'vh';b.style.animationDelay=-Math.random()*9+'s';butterflies.appendChild(b)}}particles();
    function tick(){const ms=state.eventDate-new Date();const s=Math.max(0,Math.floor(ms/1000));const vals=[Math.floor(s/86400),Math.floor(s/3600)%24,Math.floor(s/60)%60,s%60];document.querySelectorAll('#countdown b').forEach((b,i)=>b.textContent=String(vals[i]).padStart(2,'0'))}tick();setInterval(tick,1000);
    function guest(){const visible=document.getElementById('guestName'),dash=document.getElementById('dashGuest');return ((visible&&visible.value)||(dash&&dash.value)||'Honoured Guest').trim()}
    function makePass(){const seed=guest()+'|Sevvri-Rahma|AQDI|2026-10-23|ONE-GUEST';let h=2166136261;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619)}state.passKey='AQDI-'+(h>>>0).toString(36).toUpperCase()+'-1G';document.getElementById('passKey').textContent=state.passKey;document.getElementById('dashStatus').textContent='Security pass generated for '+guest()+': '+state.passKey;drawQR(state.passKey);localStorage.setItem('aqdiGuestControl',JSON.stringify({guest:guest(),pass:state.passKey,notes:document.getElementById('dashNotes').value,oneCard:'One Card = One Guest'}));show(9)}
    document.getElementById('makePass').onclick=makePass;document.getElementById('dashSave').onclick=makePass;
    function updateWhatsApp(){const msg='Assalamu alaikum, I confirm my attendance for the AQDI Ceremony of Sevvri T. Msangi and Rahma Riyadh Kisuo. Guest: '+guest()+'. One Card = One Guest.';document.getElementById('whatsappBtn').href='https://wa.me/'+state.coordinatorWhatsApp+'?text='+encodeURIComponent(msg)}
    const guestNameInput=document.getElementById('guestName'),dashGuestInput=document.getElementById('dashGuest');if(guestNameInput)guestNameInput.addEventListener('input',updateWhatsApp);if(dashGuestInput)dashGuestInput.addEventListener('input',updateWhatsApp);updateWhatsApp();
    document.getElementById('dashToggle').onclick=()=>document.getElementById('dashPanel').classList.toggle('open');
    function drawQR(text){const c=document.getElementById('qrCanvas'),x=c.getContext('2d'),n=21,cell=c.width/n;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#2f2418';function sq(a,b,w){x.fillRect(a*cell,b*cell,w*cell,w*cell)}[[0,0],[14,0],[0,14]].forEach(p=>{sq(p[0],p[1],7);x.fillStyle='#fff';sq(p[0]+1,p[1]+1,5);x.fillStyle='#2f2418';sq(p[0]+2,p[1]+2,3)});let h=0;for(let i=0;i<text.length;i++)h=(h*31+text.charCodeAt(i))>>>0;for(let y=0;y<n;y++)for(let a=0;a<n;a++){const finder=(a<8&&y<8)||(a>12&&y<8)||(a<8&&y>12);if(!finder&&(((a*17+y*29+h)>>((a+y)%13))&1))sq(a,y,1)}}
    drawQR(state.passKey);
    function scratch(){const wrap=document.getElementById('scratchWrap'),c=document.getElementById('scratchCanvas');if(!wrap||!c)return;const x=c.getContext('2d');function cover(){const g=x.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,'#d7b86b');g.addColorStop(.45,'#fff3c4');g.addColorStop(1,'#9d6e28');x.globalCompositeOperation='source-over';x.fillStyle=g;x.fillRect(0,0,c.width,c.height)}function clear(){wrap.classList.add('done');setTimeout(()=>x.clearRect(0,0,c.width,c.height),420)}function brush(e){e.preventDefault();const r=c.getBoundingClientRect(),pts=e.touches?e.touches:[e];x.globalCompositeOperation='destination-out';for(const p of pts){x.beginPath();x.arc((p.clientX-r.left)*c.width/r.width,(p.clientY-r.top)*c.height/r.height,40,0,Math.PI*2);x.fill()}}cover();c.addEventListener('click',clear);c.addEventListener('pointerdown',brush);c.addEventListener('pointermove',e=>{if(e.buttons)brush(e)});c.addEventListener('touchstart',brush,{passive:false});c.addEventListener('touchmove',brush,{passive:false})}scratch();
    const app=document.getElementById('app');let scrollTimer;app.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>setActive(Math.round(app.scrollTop/window.innerHeight)),80)},{passive:true});
    const saved=localStorage.getItem('aqdiGuestControl');if(saved){try{const j=JSON.parse(saved);document.getElementById('dashStatus').textContent='Saved guest: '+j.guest+' / '+j.pass;document.getElementById('passKey').textContent=j.pass;drawQR(j.pass)}catch(e){}}
    show(0);
  })();
  </script>
</body>
</html>
