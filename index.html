<script>
(()=>{
 const total=16;
 function label(number){const el=document.createElement('span');el.className='aqdi-page-number';el.textContent=String(number).padStart(2,'0')+' / '+total;el.setAttribute('aria-label','Page '+number+' of '+total);return el;}
 const intro=document.getElementById('intro');
 intro.append(label(1));
 const invitation=document.getElementById('invitation');
 function numberCards(){invitation.querySelectorAll('.invitation-slide').forEach((section,i)=>{if(!section.querySelector(':scope > .aqdi-page-number'))section.append(label(i+2));});}
 new MutationObserver(numberCards).observe(invitation,{childList:true});
 numberCards();
})();
</script>
